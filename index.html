 // a -> b の送金をプラスとして計算。過去の送金済み額を控除する。

}

 if(isDemo||members.length<2)return;

 const aa=rows.filter(e=>e.paid_by===a.user_id).reduce((v,e)=>v+Number(e.amount||0),0),bb=rows.filter(e=>e.paid_by===b.user_id).reduce((v,e)=>v+Number(e.amount||0),0);
 const paid=(data.settlementHistory||[]).filter(x=>x.month===settleMonth).reduce((v,h)=>v+(h.from===a.user_id?Number(h.amount):h.to===a.user_id?-Number(h.amount):0),0);

}

 $('#life-cancel').onclick=closeModal;
 $('#life-remove-chore')?.addEventListener('click',()=>{if(!confirm('この家事を削除する？ 実施履歴は残します'))return;data.lifeChores=data.lifeChores.filter(z=>String(z.id)!==editId);lifeStorage();closeModal();render()});
 let submitting=false;
 $('#life-chore-form').onsubmit=ev=>{
  ev.preventDefault();
  if(submitting)return;
  submitting=true;
  const f=ev.currentTarget;
  try{
   const entry={name:f.querySelector('input[name="name"]').value.trim(),date:f.querySelector('input[name="date"]').value,repeat:f.querySelector('select[name="repeat"]').value,assignee:f.querySelector('select[name="assignee"]').value};
   if(!entry.name||!lifeDate(entry.date)){toast('家事名と日付を確認してください');return}
   // Start from the actual stored snapshot, not an object potentially mutated by another UI handler.
   const stored=isDemo?JSON.parse(localStorage.getItem('fl-demo')||'null'):null;
   const diskLife=readLifeDisk();
   const source=Array.isArray(diskLife?.lifeChores)?diskLife.lifeChores:(data.lifeChores||[]);
   const before=source.map(x=>({...x}));
   let next;
   if(editId){
    const matches=before.filter(x=>String(x.id)===editId);
    if(matches.length!==1){toast('編集対象が一意ではありません。保存を中止しました');return}
    next=before.map(x=>String(x.id)===editId?{...x,...entry,id:editId}:x);
   }else{
    let freshId=lifeNewId();while(before.some(x=>String(x.id)===freshId))freshId=lifeNewId();
    next=[...before,{id:freshId,...entry}];
   }
   // Strict safety invariant: adding can only append one record, editing can only change one ID.
   const ids=next.map(x=>String(x.id));
   const uniqueIds=new Set(ids).size===ids.length;
   const unchanged=before.every((old,i)=>JSON.stringify(old)===JSON.stringify(next[i]));
   const safe=uniqueIds&&(editId?(next.length===before.length&&before.filter((old,i)=>String(old.id)!==editId&&JSON.stringify(old)!==JSON.stringify(next[i])).length===0):(next.length===before.length+1&&unchanged));
   if(!safe){toast('既存の家事が変わる可能性があるため、保存を中止しました');return}
   const nextData={...(stored||data),lifeChores:next};
   if(isDemo){localStorage.setItem(LIFE_KEY,JSON.stringify({lifeChores:next,lifeEvents:diskLife?.lifeEvents||data.lifeEvents||[],lifeDone:diskLife?.lifeDone||data.lifeDone||[]}));localStorage.setItem('fl-demo',JSON.stringify(nextData));const verified=readLifeDisk();if(JSON.stringify(verified?.lifeChores)!==JSON.stringify(next))throw new Error('家事の保存後検証に失敗しました');}
   data=nextData;
   lifeSelected=entry.date;
   closeModal();render();toast(editId?'家事を更新しました':'家事を追加しました');
  }catch(error){console.error('家事保存エラー',error);toast('保存できませんでした：'+(error?.message||'不明なエラー'))}
  finally{submitting=false}
 };
}

function splitLegacyIngredient(line){const raw=String(line||'').trim();const m=raw.match(/^(.+?)\s*([0-9０-９]+(?:[.．／\/][0-9０-９]+)?\s*(?:個|本|枚|袋|パック|束|玉|丁|缶|箱|粒|片|切れ|杯|人分|g|kg|ml|mL|L|リットル|大さじ|小さじ)(?:\s*[0-9０-９]+(?:[\/／][0-9０-９]+)?)?)$/i);return m?{name:m[1].trim(),quantity:m[2].trim()}:{name:raw,quantity:''}}
function recipeGroups(r){return Array.isArray(r.ingredientGroups)?r.ingredientGroups.filter(g=>g&&g.id).map(g=>({id:String(g.id),symbol:String(g.symbol||'☆'),name:String(g.name||'調味料')})):[]}
function recipeSteps(r){if(Array.isArray(r.stepItems))return r.stepItems.map(x=>({text:String(x.text||''),photo:String(x.photo||'')})).filter(x=>x.text||x.photo);const raw=String(r.steps||'').trim();if(!raw)return [];let lines=raw.split(/\n+/).map(x=>x.replace(/^\s*(?:手順\s*)?(?:\d+[.)．、]|[①②③④⑤⑥⑦⑧⑨⑩])\s*/,'').trim()).filter(Boolean);return lines.map(text=>({text,photo:''}))}
function recipeIngredients(r){if(Array.isArray(r.ingredientItems))return r.ingredientItems.map(x=>({name:String(x.name||'').trim(),quantity:String(x.quantity||'').trim(),groupId:String(x.groupId||'')})).filter(x=>x.name);return String(r.ingredients||'').split('\n').map(splitLegacyIngredient).filter(x=>x.name).map(x=>({...x,groupId:''}))}

function categoryModal(){
 if(!useSnapshot()){toast('カテゴリ編集のクラウド同期は公開前に対応します');return}

 $('#rename-category').onclick=()=>{let old=c(),n=$('#new-category').value.trim();if(!n||n.length>40||categoryNames().includes(n))return toast('別のカテゴリ名を入力してください');if(!confirm(old+'を'+n+'に変更し、過去の支出も更新する？'))return;data.expenses.forEach(e=>{if(e.category===old)e.category=n});data.categories=data.categories.map(x=>x===old?n:x);if(data.subcategories[old]){data.subcategories[n]=unique([...(data.subcategories[n]||[]),...data.subcategories[old]]);delete data.subcategories[old]}if(data.categoryBudgets[old]){data.categoryBudgets[n]=data.categoryBudgets[old];delete data.categoryBudgets[old]}if(data.subBudgets[old]){data.subBudgets[n]={...(data.subBudgets[n]||{}),...data.subBudgets[old]};delete data.subBudgets[old]}if(data.hiddenSubs[old]){data.hiddenSubs[n]=data.hiddenSubs[old];delete data.hiddenSubs[old]}refresh()};

 $('#add-sub').onclick=()=>{let n=$('#new-sub').value.trim();if(!n||n.length>60)return toast('内容名を入力してください');if(subNames(c()).includes(n))return toast('同じ内容があります');(data.subcategories[c()]??=[]).push(n);data.hiddenSubs[c()]=(data.hiddenSubs[c()]||[]).filter(x=>x!==n);refresh()};
 $('#rename-sub').onclick=()=>{let old=sub(),n=$('#new-sub').value.trim(),cat=c();if(!old||!n||n.length>60||subNames(cat).includes(n))return toast('別の内容名を入力してください');if(!confirm(old+'を'+n+'に変更し、過去の支出も更新する？'))return;data.expenses.forEach(e=>{if(e.category===cat&&e.subcategory===old)e.subcategory=n});data.subcategories[cat]=unique([...(data.subcategories[cat]||[]).filter(x=>x!==old),n]);data.hiddenSubs[cat]=unique([...(data.hiddenSubs[cat]||[]).filter(x=>x!==n),old]);if(data.subBudgets?.[cat]?.[old]){data.subBudgets[cat][n]=data.subBudgets[cat][old];delete data.subBudgets[cat][old]}refresh()};

function historyToExpense(id){if(!useSnapshot())return;const h=data.purchaseHistory.find(x=>x.id===id);if(!h||h.linkedExpenseId)return toast('登録済みの購入履歴です');if(h.total===null||h.total<=0)return toast('先に購入履歴へ合計金額を入力してください');const categories=categoryNames();const suggested=storeCandidates(h.store||'').find(x=>x.title===h.store);const cat=suggested?.category||'食費';const sub=suggested?.subcategory||'スーパー';modal(`<h2>生活費に登録</h2><p class="tip">購入履歴と支出を紐付けて二重登録を防ぎます。必要なときだけ登録できます。</p><form id="shop-expense-form"><label>カテゴリ</label><select name="category">${categories.map(x=>`<option value="${esc(x)}" ${x===cat?'selected':''}>${esc(x)}</option>`).join('')}</select><label>内容（サブカテゴリ）</label><input name="subcategory" required maxlength="60" value="${esc(sub)}"><label>詳細（店名）</label><input name="title" maxlength="80" required value="${esc(h.store||'買い物')}"><label>合計金額</label><input type="number" name="amount" min="1" required value="${h.total}"><label>支払方法</label><select name="paid_by"><option value="shared">共有財布から支払い</option>${members.map(m=>`<option value="${esc(m.user_id)}">${esc(m.display_name)}が立て替え</option>`).join('')}</select><div class="form-actions"><button type="button" class="btn ghost" id="cancel">戻る</button><button class="btn">生活費へ登録</button></div></form>`);$('#cancel').onclick=closeModal;$('#shop-expense-form').onsubmit=e=>{e.preventDefault();if(h.linkedExpenseId)return toast('すでに登録済みです');const f=e.target.elements,amount=Number(f.amount.value);if(!Number.isFinite(amount)||amount<=0)return toast('金額を確認してください');const newid=crypto.randomUUID();data.expenses.push({id:newid,date:h.date,category:f.category.value,subcategory:f.subcategory.value.trim(),title:f.title.value.trim(),amount,paid_by:f.paid_by.value,shoppingHistoryId:h.id});h.linkedExpenseId=newid;shopSaved();closeModal();render();toast('生活費に登録しました')};}
async function toggleShopping(id){let old=data.shopping.find(i=>i.id===id);if(!old)return;try{if(useSnapshot()){old.done=!old.done;stateSave()}else{let r=await supabase.from('shopping_items').update({done:!old.done}).eq('id',id).eq('household_id',home.id);if(r.error)throw r.error;await reload()}render()}catch(e){toast(e.message)}}
async function removeShopping(id){if(!confirm('この商品を削除する？'))return;try{if(useSnapshot()){data.shopping=data.shopping.filter(i=>i.id!==id);stateSave()}else{let r=await supabase.from('shopping_items').delete().eq('id',id).eq('household_id',home.id);if(r.error)throw r.error;await reload()}render()}catch(e){toast(e.message)}}
async function deleteExpense(id){if(!confirm('この支出を削除する？'))return;try{if(useSnapshot()){data.expenses=data.expenses.filter(i=>i.id!==id);for(const h of data.purchaseHistory||[])if(h.linkedExpenseId===id)h.linkedExpenseId=null;stateSave()}else{let r=await supabase.from('expenses').delete().eq('id',id).eq('household_id',home.id);if(r.error)throw r.error;await reload()}closeModal();render();toast('削除しました')}catch(e){toast(e.message)}}
function cloudModal(){modal(`<h2>クラウド設定</h2><div class="notice">自分で作成したSupabaseプロジェクトのURLと公開用キー（anon / publishable）を入力します。<strong>service_roleキー・secretキーは絶対に入力しないでください。</strong><br>先に同梱の setup_v1.7.sql をSupabase SQL Editorで実行してください。</div><form id="cloudform"><label>Project URL</label><input type="url" name="url" placeholder="https://xxxx.supabase.co" required><label>Publishable / anon key</label><input type="text" name="key" required placeholder="sb_publishable_... または eyJ..."><div class="form-actions"><button type="button" class="btn ghost" id="cancel">戻る</button><button class="btn">接続する</button></div></form>`);$('#cancel').onclick=closeModal;$('#cloudform').onsubmit=e=>{e.preventDefault();let url=e.target.elements.url.value.trim(),key=e.target.elements.key.value.trim();try{let u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co'))throw Error('SupabaseのHTTPS URLを入力してください');if(!key||key.startsWith('sb_secret_'))throw Error('公開用キーを入力してください');localStorage.setItem('fl-cloud',JSON.stringify({url,key}));location.reload()}catch(err){toast(err.message)}}}
function authView(){$('#app').innerHTML=`<div style="max-width:430px;margin:65px auto"><div class="eyebrow">FUTARI LIFE ♡</div><h1>2人の生活を、ひとつに。</h1><p class="muted">共有家計・買い物リストを2人で同期</p><div class="card"><h2>ログイン / 新規登録</h2><form id="authform"><label>メールアドレス</label><input type="email" name="email" required autocomplete="email"><label>パスワード（6文字以上）</label><input type="password" name="password" required minlength="6" autocomplete="current-password"><div class="form-actions"><button class="btn ghost" type="button" id="signup">新規登録</button><button class="btn" type="submit">ログイン</button></div></form></div><button class="action" id="backdemo">体験モードに戻る</button></div>`;$('#signup').onclick=()=>authAction('signup');$('#authform').onsubmit=e=>{e.preventDefault();authAction('login')};$('#backdemo').onclick=()=>{localStorage.removeItem('fl-cloud');location.reload()}}
async function authAction(type){let f=$('#authform'),email=f.elements.email.value.trim(),password=f.elements.password.value;try{const {data:result,error}=type==='signup'?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(error)throw error;toast(type==='signup'&&!result.session?'確認メールが届いたら、認証後にログインしてね':'ログインしました');if(result.session){session=result.session;await initHome()}}catch(e){toast(e.message)}}
async function initHome(){let {data:mem,error}=await supabase.from('household_members').select('household_id,display_name').eq('user_id',session.user.id).limit(1);if(error){toast(error.message);return}if(!mem?.length){home=null;members=[];render();return}let h=await supabase.from('households').select('id,name,budget').eq('id',mem[0].household_id).single();if(h.error){toast(h.error.message);return}home=h.data;await reload();subscribe();render()}
async function reload(){
 if(!home)return;
 const [snap,m,h]=await Promise.all([
  supabase.from('household_snapshots').select('payload,version').eq('household_id',home.id).maybeSingle(),
  supabase.from('household_members').select('user_id,display_name').eq('household_id',home.id),
  supabase.from('households').select('id,name,budget').eq('id',home.id).single()
 ]);
 for(const r of [snap,m,h])if(r.error)throw r.error;
 if(cloudPending||cloudSaving||cloudConflict)return; // never overwrite locally unsynced edits
 data=snap.data?.payload && typeof snap.data.payload==='object' ? snap.data.payload : {budget:180000,expenses:[],shopping:[]};
 cloudVersion=Number(snap.data?.version||0);
 members=m.data||[];home=h.data;
 initMeta();initShopV13();initLife();initMeals();
 cloudStatus('クラウド保存済み');
}
function subscribe(){
 if(realtime)supabase.removeChannel(realtime);
 realtime=supabase.channel('futari-snapshot-'+home.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'household_snapshots',filter:'household_id=eq.'+home.id},refresh)
 .on('postgres_changes',{event:'*',schema:'public',table:'household_members',filter:'household_id=eq.'+home.id},refresh)
 .subscribe();
}
let refreshing=false;
async function refresh(){
 if(refreshing||cloudPending||cloudSaving||cloudConflict)return;
 refreshing=true;
 try{await reload();render()}catch(e){cloudStatus('同期エラー');console.warn(e)}finally{refreshing=false}
}
function householdView(){$('#app').innerHTML=`<div style="max-width:470px;margin:60px auto"><div class="eyebrow">FUTARI LIFE ♡</div><h1>共有スペースをつくろう</h1><p class="tip">最初の1人は「新しく作成」、もう1人は発行された招待コードで参加するよ。</p><div class="card"><h3>新しい共有スペース</h3><form id="createhome"><label>あなたの表示名</label><input name="name" required maxlength="40" placeholder="例：たつき"><label>スペース名</label><input name="title" required maxlength="50" value="2人の家"><button class="btn" style="margin-top:15px;width:100%">作成する</button></form></div><div class="card"><h3>招待コードで参加</h3><form id="joinhome"><label>あなたの表示名</label><input name="name" required maxlength="40" placeholder="例：ゆうの"><label>招待コード</label><input name="code" required maxlength="12" placeholder="例：ABC12345"><button class="btn" style="margin-top:15px;width:100%">参加する</button></form></div><button class="action" id="logout">ログアウト</button></div>`;$('#logout').onclick=async()=>{await supabase.auth.signOut();session=null;render()};$('#createhome').onsubmit=async e=>{e.preventDefault();let f=e.target;try{let r=await supabase.rpc('create_household',{p_name:f.elements.title.value.trim(),p_display_name:f.elements.name.value.trim()});if(r.error)throw r.error;await initHome();toast('共有スペースを作成しました')}catch(err){toast(err.message)}};$('#joinhome').onsubmit=async e=>{e.preventDefault();let f=e.target;try{let r=await supabase.rpc('join_household',{p_code:f.elements.code.value.trim().toUpperCase(),p_display_name:f.elements.name.value.trim()});if(r.error)throw r.error;await initHome();toast('共有スペースに参加しました')}catch(err){toast(err.message)}}}
async function invite(){try{let r=await supabase.rpc('create_invite',{p_household:home.id});if(r.error)throw r.error;modal(`<h2>招待コード</h2><p class="tip">相手がアカウントを作成して、共有スペースに参加するときに入力してください。コードは24時間有効・1回限りです。</p><div class="card" style="text-align:center"><div style="font-size:25px;font-weight:800;letter-spacing:3px">${esc(r.data)}</div></div><div class="form-actions"><button class="btn ghost" id="cancel">閉じる</button><button class="btn" id="copycode">コピー</button></div>`);$('#cancel').onclick=closeModal;$('#copycode').onclick=async()=>{await navigator.clipboard.writeText(r.data);toast('コードをコピーしました')}}catch(err){toast(err.message)}}
async function importData(ev){
 const file=ev.target.files?.[0];ev.target.value='';if(!file)return;
 try{
  const raw=JSON.parse(await file.text()),v=raw?.data||raw;
  if(!v||!Array.isArray(v.expenses)||!Array.isArray(v.shopping)||!Number.isFinite(Number(v.budget)))throw Error('Futari Lifeのバックアップ形式ではありません');
  if(cloudPending||cloudSaving||cloudConflict)throw Error('未同期の変更があるため読み込めません');
  if(!confirm('現在の'+(isDemo?'体験データ':'共有スペース全員のデータ')+'をバックアップの内容で置き換えます。先に現在のJSONを保存してください。続行しますか？'))return;
  data=JSON.parse(JSON.stringify(v));initMeta();initShopV13();initLife();initMeals();stateSave();render();toast('読み込みました。クラウドの場合は保存済み表示を確認してください');
 }catch(err){toast('読み込み失敗：'+err.message)}
}
function exportData(){let content=JSON.stringify({exported_at:new Date().toISOString(),data},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download='futari-life-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){theme();if(conf){try{({createClient}=await import('https://esm.sh/@supabase/supabase-js@2'));supabase=createClient(conf.url,conf.key,{auth:{persistSession:true,autoRefreshToken:true}});let {data:d,error}=await supabase.auth.getSession();if(error)throw error;session=d.session;isDemo=false;supabase.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;home=null;render()}});if(session)await initHome();else render()}catch(e){toast('接続エラー: '+e.message);authView()}}else{members=[{user_id:'demo',display_name:'自分'}];initMeta();initShopV13();initLife();initMeals();render()}}
boot();
</script></body></html>
